name: Follow upstream releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Upstream sync verification]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.UPSTREAM_SYNC_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find next stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --state open --label upstream-sync --json number --jq 'length' | grep -qv '^0$'; then
            echo 'An upstream sync PR is already open; process releases in order.'
            exit 0
          fi
          python3 .github/scripts/next_upstream_release.py \
            --repo wushuo894/ani-rss \
            --marker .github/upstream-release.txt \
            --output "$GITHUB_OUTPUT"
      - name: Merge upstream release into a sync branch
        if: steps.release.outputs.tag != ''
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SYNC_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/wushuo894/ani-rss.git \
            "refs/tags/${RELEASE_TAG}:refs/upstream-releases/${RELEASE_TAG}"
          git switch -c "$SYNC_BRANCH"
          if ! git merge --no-ff --no-edit "refs/upstream-releases/${RELEASE_TAG}"; then
            git merge --abort
            title="[upstream-sync] ${RELEASE_TAG} needs conflict resolution"
            if ! gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --title "$title" --body "Automatic merge of upstream ${RELEASE_TAG} conflicted. Merge it into a branch based on fork main, preserve the OpenList downloader, and update .github/upstream-release.txt before merging. Upstream release: https://github.com/wushuo894/ani-rss/releases/tag/${RELEASE_TAG}"
            fi
            exit 1
          fi
          printf '%s\n' "$RELEASE_TAG" > .github/upstream-release.txt
          git add .github/upstream-release.txt
          git commit -m "Track upstream ${RELEASE_TAG} release"
          git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          echo "branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"
      - name: Open PR and run verification
        if: steps.merge.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --color 0969da --description 'Upstream release synchronization' --force
          pr_url=$(gh pr create --base main --head "$SYNC_BRANCH" \
            --title "Sync upstream ${RELEASE_TAG}" \
            --body "Upstream release: https://github.com/wushuo894/ani-rss/releases/tag/${RELEASE_TAG}

          This PR merges the upstream release into the OpenList fork. It will merge automatically when verification passes, the base is current, and GitHub reports no merge conflicts. Review changes to the native OpenList downloader carefully." \
            --label upstream-sync)
          gh workflow run upstream-verify.yml --ref "$SYNC_BRANCH"
          echo "Opened $pr_url"

  merge-verified:
    needs: sync
    if: always() && vars.UPSTREAM_SYNC_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge verified sync PRs without conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label upstream-sync \
            --json number,headRefName --jq '.[] | [.number,.headRefName] | @tsv' |
          while IFS=$'\t' read -r number branch; do
            [ -n "$number" ] || continue
            case "$branch" in sync/upstream-*) ;; *) continue ;; esac
            head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')
            base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.base.sha')
            gh api "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${head_sha}" \
              --jq '.merge_base_commit.sha' | grep -Fxq "$base_sha" || {
                echo "PR #${number}: base moved; manual branch refresh required"
                continue
              }
            verified=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow upstream-verify.yml --event workflow_dispatch --branch "$branch" --limit 100 \
              --json headSha,status,conclusion \
              --jq "any(.[]; .headSha == \"${head_sha}\" and .status == \"completed\" and .conclusion == \"success\")")
            if [ "$verified" != true ]; then
              echo "PR #${number}: dispatch verification has not passed"
              continue
            fi
            mergeable=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.mergeable')
            if [ "$mergeable" != true ]; then
              echo "PR #${number}: mergeable is ${mergeable}; not merging"
              continue
            fi
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$head_sha"
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Merged PR #${number} and dispatched fork release build"
          done

  cleanup-merged-branch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete merged sync branches that still point to their PR heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and
              any(.labels[]; .name == "upstream-sync")) |
              [.number, .head.ref, .head.sha, .head.repo.full_name] | @tsv' |
          while IFS=$'\t' read -r number branch head_sha head_repo; do
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || continue
            case "$branch" in sync/upstream-*) ;; *) continue ;; esac
            current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null) || continue
            [ "$current_sha" = "$head_sha" ] || continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged PR #${number} branch ${branch}"
          done
